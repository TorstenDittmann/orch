name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ${{ matrix.check.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Validate generated sources and formatting
            run: make generate-check fmt-check pkl-test
          - name: Run Go vet
            run: make vet
          - name: Check for known vulnerabilities
            run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          - name: Run Go tests
            run: make test
          - name: Run Go race tests
            run: make test-race
          - name: Run Go tests on arm64
            runner: ubuntu-24.04-arm
            run: make test
          - name: Build Linux amd64 and arm64
            run: |
              for arch in amd64 arm64; do
                GOOS=linux GOARCH=$arch CGO_ENABLED=0 mise exec -- go build -trimpath -o /tmp/orch-linux-$arch ./cmd/orch
              done
          - name: Build CLI for macOS and Windows
            run: |
              for platform in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
                GOOS=${platform%/*} GOARCH=${platform#*/} CGO_ENABLED=0 mise exec -- go build -trimpath -o /dev/null ./cmd/orch
              done
          - name: Compile Linux network and containerd tests
            run: |
              for arch in amd64 arm64; do
                GOOS=linux GOARCH=$arch CGO_ENABLED=0 mise exec -- go test -c -o /tmp/orch-network-$arch.test ./internal/network
                GOOS=linux GOARCH=$arch CGO_ENABLED=0 mise exec -- go test -c -o /tmp/orch-containerd-$arch.test ./internal/e2e
              done
          - name: Test the workload firewall against the kernel
            run: |
              mise exec -- go test -c -o /tmp/orch-network.test ./internal/network
              sudo ORCH_FIREWALL_E2E=1 unshare -n /tmp/orch-network.test -test.run TestWorkloadFirewall -test.v
              # The volume backup view needs root to bind-mount; run it in its own mount namespace.
              mise exec -- go test -c -o /tmp/orch-agent.test ./internal/agent
              sudo unshare -m /tmp/orch-agent.test -test.run TestVolumeBackupView -test.v
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Download dependencies
        run: mise exec -- go mod download
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}
