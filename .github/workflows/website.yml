name: Website checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    name: Check and build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: jdx/mise-action@v2
      - name: Install pinned website dependencies
        working-directory: website
        run: mise exec -- bun install --frozen-lockfile
      - name: Type-check website
        working-directory: website
        run: mise exec -- bun run check
      - name: Build production website (fails on broken links)
        working-directory: website
        run: mise exec -- ./build.sh
      - name: Verify generated website contract
        run: |
          for file in index.html quick-start/index.html pkl/v1alpha1/Application.pkl 404.html sitemap.xml robots.txt llms.txt server/index.js; do
            test -f "website/dist/$file"
          done
      - name: Build Dokploy image
        run: docker build -f website/Dockerfile --build-arg SITE_URL=https://docs.example.com -t orch-website:test .
      - name: Smoke test static container
        run: |
          docker run -d --name orch-website-test -p 127.0.0.1:8080:8080 orch-website:test
          trap 'docker rm -f orch-website-test' EXIT
          base=http://127.0.0.1:8080
          curl --retry 10 --retry-delay 1 --retry-all-errors -fsS "$base/" -o /dev/null \
            || { docker logs orch-website-test; exit 1; }
          curl -fsS "$base/quick-start/" -o /dev/null
          curl -fsS "$base/sitemap.xml" | grep -F 'https://docs.example.com/'
          curl -fsS "$base/robots.txt" | grep -F 'https://docs.example.com/sitemap.xml'
          curl -fsS "$base/quick-start" -o /dev/null
          curl -fsS "$base/pkl/v1alpha1/Application.pkl" | cmp - pkl/v1alpha1/Application.pkl
          test "$(curl -sS -o missing.html -w '%{http_code}' "$base/this-page-does-not-exist")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/server/index.js")" = 404
