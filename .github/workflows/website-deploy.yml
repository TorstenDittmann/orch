name: Website deploy

# Prerenders the website and deploys it with orch as a static site. Needs the
# ORCH_CLUSTER and ORCH_VERSION repository variables and an `orch github
# trust` for this repository (see website/README.md).

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - pkl/**
      - .github/workflows/website-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: orch-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install pinned website dependencies
        working-directory: website
        run: mise exec -- bun install --frozen-lockfile
      - name: Prerender website
        working-directory: website
        run: mise exec -- bun run check && mise exec -- bun run build:site
      # Pinned by commit, so the action installs the orch version below.
      - uses: TorstenDittmann/orch@e0873bd547761f314660ca565c049e7a5e2171c3 # v0.1.15
        with:
          cluster: ${{ vars.ORCH_CLUSTER }}
          version: ${{ vars.ORCH_VERSION }}
          app: orch
          file: website/orch.pkl
