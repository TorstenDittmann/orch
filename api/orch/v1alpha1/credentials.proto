syntax = "proto3";

package orch.v1alpha1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/TorstenDittmann/orch/gen/orch/v1alpha1;orchv1alpha1";

// CredentialService exchanges a trusted CI identity token for a short-lived
// deployer certificate. It needs no client certificate.
service CredentialService {
  rpc ExchangeGitHubToken(ExchangeGitHubTokenRequest) returns (ExchangeGitHubTokenResponse);
  rpc ExchangeAccessToken(ExchangeAccessTokenRequest) returns (ExchangeAccessTokenResponse);
}

message ExchangeGitHubTokenRequest {
  // GitHub Actions OIDC token whose audience is this cluster.
  string token = 1;
  // Application the job wants to deploy; it must be trusted for the token's repository.
  string application = 2;
  bytes certificate_request_der = 3;
}

message ExchangeGitHubTokenResponse {
  string application = 1;
  bytes certificate_pem = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ExchangeAccessTokenRequest {
  // The ID and secret parts of an access token.
  string token = 1;
  bytes certificate_request_der = 2;
}

message ExchangeAccessTokenResponse {
  string application = 1;
  bool read_only = 2;
  bytes certificate_pem = 3;
  google.protobuf.Timestamp expires_at = 4;
}
