syntax = "proto3";

package orch.v1alpha1;

import "google/protobuf/timestamp.proto";
import "orch/v1alpha1/agent.proto";

option go_package = "github.com/TorstenDittmann/orch/gen/orch/v1alpha1;orchv1alpha1";

service ControlService {
  rpc RunJob(RunJobRequest) returns (RunJobResponse);
  rpc RunCronJob(RunCronJobRequest) returns (RunCronJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  rpc GetApplication(GetApplicationRequest) returns (GetApplicationResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  rpc CompareDeployments(CompareDeploymentsRequest) returns (CompareDeploymentsResponse);
  rpc RollbackApplication(RollbackApplicationRequest) returns (RollbackApplicationResponse);
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc ListRecentEvents(ListRecentEventsRequest) returns (ListRecentEventsResponse);
  rpc ApplyApplication(ApplyApplicationRequest) returns (ApplyApplicationResponse);
  rpc EnrollAgent(EnrollAgentRequest) returns (EnrollAgentResponse) {
    option deprecated = true;
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc RemoveApplication(RemoveApplicationRequest) returns (RemoveApplicationResponse);
  rpc TailLogs(TailLogsRequest) returns (stream TailLogsResponse);
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc BackupVolume(BackupVolumeRequest) returns (BackupVolumeResponse);
  rpc RestoreVolume(RestoreVolumeRequest) returns (RestoreVolumeResponse);
  rpc DownloadVolumeBackup(DownloadVolumeBackupRequest) returns (stream DownloadVolumeBackupResponse);
  rpc ConfigureNetwork(ConfigureNetworkRequest) returns (ConfigureNetworkResponse);
  rpc ListCronRuns(ListCronRunsRequest) returns (ListCronRunsResponse);
  rpc TailCronLogs(TailCronLogsRequest) returns (stream TailCronLogsResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc LoginRegistry(LoginRegistryRequest) returns (LoginRegistryResponse);
  rpc ListRegistries(ListRegistriesRequest) returns (ListRegistriesResponse);
  rpc LogoutRegistry(LogoutRegistryRequest) returns (LogoutRegistryResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc ListJoinTokens(ListJoinTokensRequest) returns (ListJoinTokensResponse);
  rpc RevokeJoinToken(RevokeJoinTokenRequest) returns (RevokeJoinTokenResponse);
  rpc SetGitHubTrust(SetGitHubTrustRequest) returns (SetGitHubTrustResponse);
  rpc ListGitHubTrusts(ListGitHubTrustsRequest) returns (ListGitHubTrustsResponse);
  rpc DeleteGitHubTrust(DeleteGitHubTrustRequest) returns (DeleteGitHubTrustResponse);
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_PENDING = 1;
  EXECUTION_STATUS_BLOCKED = 2;
  EXECUTION_STATUS_STARTING = 3;
  EXECUTION_STATUS_RUNNING = 4;
  EXECUTION_STATUS_DEGRADED = 5;
  EXECUTION_STATUS_FAILED = 6;
  EXECUTION_STATUS_STOPPING = 7;
  EXECUTION_STATUS_REMOVED = 8;
  EXECUTION_STATUS_HEALTHY = 9;
  EXECUTION_STATUS_ROLLED_BACK = 10;
}

enum NodeConnectionStatus {
  NODE_CONNECTION_STATUS_UNSPECIFIED = 0;
  NODE_CONNECTION_STATUS_ENROLLED = 1;
  NODE_CONNECTION_STATUS_CONNECTED = 2;
  NODE_CONNECTION_STATUS_DISCONNECTED = 3;
  NODE_CONNECTION_STATUS_UNREACHABLE = 4;
}

enum NodeLifecycle {
  NODE_LIFECYCLE_UNSPECIFIED = 0;
  NODE_LIFECYCLE_ACTIVE = 1;
  NODE_LIFECYCLE_CORDONED = 2;
  NODE_LIFECYCLE_DRAINING = 3;
  NODE_LIFECYCLE_REMOVED = 4;
}

message Cluster {
  string id = 1;
  string name = 2;
  string endpoint = 3;
  uint64 generation = 4;
  google.protobuf.Timestamp created_at = 5;
  string workload_cidr = 6;
  uint64 network_generation = 7;
  bool network_frozen = 8;
}

message Application {
  string name = 1;
  uint64 generation = 2;
  string revision_id = 3;
  string digest = 4;
  string canonical_manifest_json = 5;
  ExecutionStatus execution_status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  uint64 observed_generation = 9;
  string execution_reason = 10;
  string execution_message = 11;
  google.protobuf.Timestamp execution_updated_at = 12;
  repeated AllocationStatus allocations = 13;
  bool deleted = 14;
  uint64 active_generation = 15;
  string active_revision_id = 16;
  repeated RouteStatus routes = 17;
  repeated TCPRouteStatus tcp_routes = 18;
  repeated CronJobStatus cron_jobs = 19;
  repeated NodePortStatus node_ports = 20;
}

message Node {
  string id = 1;
  string name = 2;
  NodeConnectionStatus connection_status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  string operating_system = 6;
  string architecture = 7;
  string runtime_version = 8;
  string snapshotter = 9;
  bool cgroups_v2 = 10;
  uint64 assignment_generation = 11;
  uint64 acknowledged_generation = 12;
  string node_subnet = 13;
  string network_state = 14;
  string network_reason = 15;
  string cni_version = 16;
  bool nftables = 17;
  string dns_state = 18;
  string caddy_version = 19;
  string ingress_state = 20;
  uint32 draining_objects = 21;
  string cni_plugins_version = 22;
  bool dns_available = 23;
  uint32 ordinal = 24;
  NodeLifecycle lifecycle = 25;
  map<string, string> labels = 26;
  bool ingress = 27;
  uint64 total_cpu_millis = 28;
  uint64 total_memory_bytes = 29;
  uint64 allocatable_cpu_millis = 30;
  uint64 allocatable_memory_bytes = 31;
  string advertise_address = 32;
  string wireguard_public_key = 33;
  uint32 wireguard_listen_port = 34;
  uint64 assigned_cpu_millis = 35;
  uint64 assigned_memory_bytes = 36;
  repeated string drain_blockers = 37;
  google.protobuf.Timestamp certificate_not_after = 38;
  string certificate_state = 39;
  string certificate_reason = 40;
}

message Event {
  uint64 sequence = 1;
  string kind = 2;
  string payload_json = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetClusterRequest {}

message GetClusterResponse {
  Cluster cluster = 1;
  // PEM cluster CA, so administrators can mint join tokens that pin it.
  bytes ca_certificate_pem = 2;
  ControllerBackup backup = 3;
}

// ControllerBackup describes the controller's automatic daily backups.
message ControllerBackup {
  // False when automatic backups are turned off.
  bool enabled = 1;
  google.protobuf.Timestamp latest_at = 2;
  string latest_path = 3;
  google.protobuf.Timestamp failed_at = 4;
  string failure = 5;
}

message GetApplicationRequest {
  string name = 1;
}

message GetApplicationResponse {
  Application application = 1;
}

message ApplicationSummary {
  string name = 1;
  uint64 generation = 2;
  string revision_id = 3;
  ExecutionStatus execution_status = 4;
  uint64 observed_generation = 5;
  uint64 active_generation = 6;
  string execution_reason = 7;
  string execution_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp execution_updated_at = 11;
}

message ListApplicationsRequest {}

message ListApplicationsResponse {
  repeated ApplicationSummary applications = 1;
}

enum RuntimeKind {
  RUNTIME_KIND_UNSPECIFIED = 0;
  RUNTIME_KIND_SERVICE = 1;
  RUNTIME_KIND_CRON_RUN = 2;
}

// RuntimeSummary is an allowlisted control-plane view of one Orch-owned
// workload. It deliberately does not expose containerd object identifiers or
// desired environment/secret material.
message RuntimeSummary {
  string id = 1;
  RuntimeKind kind = 2;
  string application = 3;
  string resource = 4;
  uint32 replica = 5;
  string run_id = 6;
  string node_id = 7;
  string node_name = 8;
  NodeConnectionStatus node_connection = 9;
  AllocationPhase allocation_phase = 10;
  JobRunState job_run_state = 11;
  HealthStatus health_status = 12;
  uint64 application_generation = 13;
  string revision_id = 14;
  string spec_digest = 15;
  uint32 restart_count = 16;
  int32 exit_code = 17;
  bool has_exit_code = 18;
  string address = 19;
  uint32 declared_port = 20;
  uint64 cpu_millis = 21;
  uint64 memory_bytes = 22;
  string reason = 23;
  string message = 24;
  google.protobuf.Timestamp scheduled_at = 25;
  google.protobuf.Timestamp started_at = 26;
  google.protobuf.Timestamp ready_at = 27;
  google.protobuf.Timestamp finished_at = 28;
  google.protobuf.Timestamp updated_at = 29;
}

message ListRuntimesRequest {
  uint32 limit = 1;
}

message ListRuntimesResponse {
  repeated RuntimeSummary runtimes = 1;
  bool truncated = 2;
}

message ListEventsRequest {
  uint64 after_sequence = 1;
  uint32 limit = 2;
}

message ListEventsResponse {
  repeated Event events = 1;
  uint64 next_after_sequence = 2;
}

message ListRecentEventsRequest {
  uint32 limit = 1;
}

message ListRecentEventsResponse {
  repeated Event events = 1;
  uint64 next_after_sequence = 2;
}

message ApplyApplicationRequest {
  bytes manifest_toml = 1 [deprecated = true];
  string idempotency_key = 2;
  bytes canonical_manifest_json = 3;
  // Where this deployment came from, such as a CI run. Recorded in history
  // only; it never changes the manifest digest or idempotent replay.
  DeploymentSource source = 4;
}

message DeploymentSource {
  // owner/name of the source repository.
  string repository = 1;
  string commit = 2;
  string ref = 3;
  // HTTPS link to the CI run that deployed.
  string run_url = 4;
  string actor = 5;
}

// digest identifies the submitted canonical manifest. Read Deployment.digest
// for the resolved revision digest when the request contains image tags.
message ApplyApplicationResponse {
  string name = 1;
  uint64 generation = 2;
  string revision_id = 3;
  string digest = 4;
  bool changed = 5;
  uint64 event_sequence = 6;
  ExecutionStatus execution_status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message EnrollAgentRequest {
  string name = 1;
  bytes certificate_request_der = 2;
  string idempotency_key = 3;
}

message EnrollAgentResponse {
  string node_id = 1;
  string node_name = 2;
  string cluster_id = 3;
  string controller_endpoint = 4;
  bytes ca_certificate_pem = 5;
  bytes agent_certificate_pem = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool changed = 8;
  uint64 event_sequence = 9;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message UpdateNodeRequest {
  string name = 1;
  map<string, string> labels = 2;
  repeated string remove_labels = 3;
  NodeLifecycle lifecycle = 4;
  bool set_ingress = 5;
  bool ingress = 6;
  string idempotency_key = 7;
}

message UpdateNodeResponse {
  Node node = 1;
  bool changed = 2;
  uint64 event_sequence = 3;
}

message RemoveNodeRequest {
  string name = 1;
  bool lost = 2;
  bool confirm_fenced = 3;
  string idempotency_key = 4;
}

message RemoveNodeResponse {
  string name = 1;
  bool changed = 2;
  uint64 event_sequence = 3;
}

message JoinTokenMetadata {
  string id = 1;
  string node_name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  string state = 5;
}

message CreateJoinTokenRequest {
  string id = 1;
  string node_name = 2;
  bytes secret_hash = 3;
  google.protobuf.Timestamp expires_at = 4;
  string idempotency_key = 5;
}

message CreateJoinTokenResponse {
  JoinTokenMetadata token = 1;
  bool changed = 2;
  uint64 event_sequence = 3;
}

message ListJoinTokensRequest {}

message ListJoinTokensResponse {
  repeated JoinTokenMetadata tokens = 1;
}

message RevokeJoinTokenRequest {
  string id = 1;
  string idempotency_key = 2;
}

message RevokeJoinTokenResponse {
  JoinTokenMetadata token = 1;
  bool changed = 2;
  uint64 event_sequence = 3;
}

message RemoveApplicationRequest {
  string name = 1;
  string idempotency_key = 2;
}

message RemoveApplicationResponse {
  string name = 1;
  uint64 generation = 2;
  bool changed = 3;
  uint64 event_sequence = 4;
  ExecutionStatus execution_status = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message TailLogsRequest {
  string application = 1;
  string service = 2;
  uint32 replica = 3;
  uint32 tail_lines = 4;
  string cursor = 5;
}

message ExecRequest {
  string application = 1;
  string service = 2;
  uint32 replica = 3;
  repeated string command = 4;
  uint32 timeout_seconds = 5;
}

// RestartServiceRequest restarts every replica of a service one at a time, or
// one replica when replica is set.
message RestartServiceRequest {
  string application = 1;
  string service = 2;
  uint32 replica = 3;
}

message RestartServiceResponse {
  repeated uint32 replicas = 1;
}

message ListVolumesRequest {
  string application = 1;
  // When set, only this volume is listed, with all of its backups.
  string volume = 2;
}

message VolumeSummary {
  string application = 1;
  string volume = 2;
  string service = 3;
  string node = 4;
  string backup_schedule = 5;
  uint32 backup_keep = 6;
  // False when the volume's node could not be asked for its backups.
  bool reachable = 7;
  // Newest first. Without a volume filter only the newest backup is listed.
  repeated VolumeBackupInfo backups = 8;
  google.protobuf.Timestamp backup_failed_at = 9;
  string backup_failure = 10;
  uint32 backup_count = 11;
}

message ListVolumesResponse {
  repeated VolumeSummary volumes = 1;
}

message BackupVolumeRequest {
  string application = 1;
  string volume = 2;
}

message BackupVolumeResponse {
  VolumeBackupInfo backup = 1;
}

message RestoreVolumeRequest {
  string application = 1;
  string volume = 2;
  string backup = 3;
}

message RestoreVolumeResponse {
  // The volume's contents just before the restore, kept as a backup.
  VolumeBackupInfo previous = 1;
}

message DownloadVolumeBackupRequest {
  string application = 1;
  string volume = 2;
  string backup = 3;
}

message DownloadVolumeBackupResponse {
  bytes data = 1;
  uint64 size_bytes = 2;
}

message ListCronRunsRequest {
  string application = 1;
  string job = 2;
  uint32 limit = 3;
}

message ListCronRunsResponse {
  repeated JobRunStatus runs = 1;
}

message TailCronLogsRequest {
  string application = 1;
  string job = 2;
  string run_id = 3;
  uint32 tail_lines = 4;
  string cursor = 5;
}

message TailCronLogsResponse {
  LogStream stream = 1;
  bytes data = 2;
  uint64 offset = 3;
  bool truncated = 4;
  bool complete = 5;
  string next_cursor = 6;
  bool cursor_reset = 7;
  bool runtime_exited = 8;
}

message SecretMetadata {
  string application = 1;
  string name = 2;
  string current_version_id = 3;
  bool referenced = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message SetSecretRequest {
  string application = 1;
  string name = 2;
  bytes value = 3;
  string idempotency_key = 4;
}

message SetSecretResponse {
  string application = 1;
  string name = 2;
  string version_id = 3;
  bool changed = 4;
  uint64 event_sequence = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListSecretsRequest {
  string application = 1;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
}

message DeleteSecretRequest {
  string application = 1;
  string name = 2;
  string idempotency_key = 3;
}

message DeleteSecretResponse {
  string application = 1;
  string name = 2;
  bool changed = 3;
  uint64 event_sequence = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message RegistryCredentialMetadata {
  string host = 1;
  string username = 2;
  string current_version_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message LoginRegistryRequest {
  string host = 1;
  string username = 2;
  bytes secret = 3;
  string idempotency_key = 4;
}

message LoginRegistryResponse {
  string host = 1;
  string username = 2;
  string version_id = 3;
  bool changed = 4;
  uint64 event_sequence = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListRegistriesRequest {}

message ListRegistriesResponse {
  repeated RegistryCredentialMetadata registries = 1;
}

message LogoutRegistryRequest {
  string host = 1;
  string idempotency_key = 2;
}

message LogoutRegistryResponse {
  string host = 1;
  bool changed = 2;
  uint64 event_sequence = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ConfigureNetworkRequest {
  string cidr = 1;
  string idempotency_key = 2;
}

message ConfigureNetworkResponse {
  string cidr = 1;
  uint64 generation = 2;
  bool frozen = 3;
  bool changed = 4;
  uint64 event_sequence = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// History deliberately excludes canonical manifests, environment and secret values.
message Deployment {
  string application = 1;
  string revision_id = 2;
  uint64 generation = 3;
  string digest = 4;
  google.protobuf.Timestamp created_at = 5;
  string rollback_from_revision_id = 6;
  string outcome = 7;
  ExecutionStatus execution_status = 8;
  string reason = 9;
  string message = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  bool current = 13;
  bool active = 14;
  repeated DeploymentImage images = 15;
  DeploymentSource source = 16;
}

message DeploymentImage {
  // Authored reference, before immutable resolution.
  string requested_image = 4;
  string kind = 1;
  string name = 2;
  string image = 3;
}

message ListDeploymentsRequest {
  string application = 1;
  uint32 limit = 2;
  uint64 before_generation = 3;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  uint64 next_before_generation = 2;
}

message GetDeploymentRequest {
  string application = 1;
  string revision_id = 2;
}

message GetDeploymentResponse {
  Deployment deployment = 1;
}

message CompareDeploymentsRequest {
  string application = 1;
  string from_revision_id = 2;
  // Empty means the current desired revision, resolved once by the controller.
  string to_revision_id = 3;
}

message DeploymentChange {
  string kind = 1;
  string path = 2;
  string before = 3;
  string after = 4;
  bool redacted = 5;
}

message CompareDeploymentsResponse {
  Deployment from = 1;
  Deployment to = 2;
  repeated DeploymentChange changes = 3;
  bool truncated = 4;
}

message RollbackApplicationRequest {
  string application = 1;
  string revision_id = 2;
  uint64 expected_generation = 3;
  string idempotency_key = 4;
}

message RollbackApplicationResponse {
  ApplyApplicationResponse deployment = 1;
}

message OneOffJob {
  string id = 1;
  string application = 2;
  string service = 3;
  string revision_id = 4;
  string image = 5;
  string kind = 6;
  string node_id = 7;
  string retry_of = 8;
  bool cancel_requested = 9;
  JobRunStatus status = 10;
}
message RunJobRequest {
  string application = 1;
  string service = 2;
  string expected_revision_id = 3;
  repeated string command = 4;
  repeated string args = 5;
  uint32 timeout_seconds = 6;
  string idempotency_key = 7;
}
message RunJobResponse {
  OneOffJob job = 1;
}
// RunCronJobRequest starts one run of a scheduled job now, on the node that
// owns the schedule, outside its schedule.
message RunCronJobRequest {
  string application = 1;
  string job = 2;
  string idempotency_key = 3;
}
message RunCronJobResponse {
  OneOffJob job = 1;
}
message GetJobRequest {
  string id = 1;
}
message GetJobResponse {
  OneOffJob job = 1;
}
message ListJobsRequest {
  string application = 1;
  uint32 limit = 2;
  string before_id = 3;
}
message ListJobsResponse {
  repeated OneOffJob jobs = 1;
  string next_before_id = 2;
}
message CancelJobRequest {
  string id = 1;
}
message CancelJobResponse {
  OneOffJob job = 1;
}
message RetryJobRequest {
  string id = 1;
  string idempotency_key = 2;
}
message RetryJobResponse {
  OneOffJob job = 1;
}

// GitHubTrust lets GitHub Actions runs of one repository deploy one
// application without stored credentials.
message GitHubTrust {
  // owner/name, lowercase.
  string repository = 1;
  string application = 2;
  string branch = 3;
  // Optional GitHub environment the run must use.
  string environment = 4;
  google.protobuf.Timestamp created_at = 5;
}

message SetGitHubTrustRequest {
  string repository = 1;
  string application = 2;
  string branch = 3;
  string environment = 4;
}

message SetGitHubTrustResponse {
  GitHubTrust trust = 1;
  bool changed = 2;
  // What a workflow needs to reach and verify this controller.
  string controller_endpoint = 3;
  string cluster_id = 4;
  bytes ca_fingerprint = 5;
}

message ListGitHubTrustsRequest {}

message ListGitHubTrustsResponse {
  repeated GitHubTrust trusts = 1;
}

message DeleteGitHubTrustRequest {
  string repository = 1;
  string application = 2;
}

message DeleteGitHubTrustResponse {
  bool changed = 1;
}
