<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch</title>
<style>
:root { --bg: #fff; --fg: #1b1f24; --muted: #667080; --line: #e3e6ea; --panel: #f6f7f9; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1116; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --panel: #161b22; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #4493f8; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active { background: var(--panel); color: var(--fg); }
#meta { margin-left: auto; color: var(--muted); font-size: 12px; }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
h2 { font-size: 15px; margin: 20px 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.wrap { white-space: normal; overflow-wrap: anywhere; }
tr.click { cursor: pointer; }
tr.click:hover { background: var(--panel); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
button.act { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; margin-right: 4px; }
button.act:hover { border-color: var(--accent); }
input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; max-height: 60vh; white-space: pre-wrap; overflow-wrap: anywhere; }
pre .stderr { color: var(--bad); }
#errors { color: var(--bad); white-space: pre-wrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>orch</h1>
  <nav id="tabs"></nav>
  <span id="meta"></span>
</header>
<main>
  <div id="errors"></div>
  <div id="view"></div>
</main>
<script>
"use strict";
const tabs = ["Overview", "Applications", "Runtimes", "Nodes", "Jobs", "Events"];
const state = { tab: location.hash.slice(1) || "Overview", snapshot: null, app: null, appData: null, log: null, jobs: null, eventFilter: "" };

function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null && value !== false) node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined) node.append(child instanceof Node ? child : String(child));
  return node;
}
function label(value) {
  if (!value) return "";
  return String(value).replace(/^(EXECUTION_STATUS|NODE_CONNECTION_STATUS|NODE_LIFECYCLE|ALLOCATION_PHASE|HEALTH_STATUS|JOB_RUN_STATE|RUNTIME_KIND|ROUTE_STATE)_/, "").toLowerCase().replace(/_/g, " ");
}
function tone(value) {
  const text = label(value);
  if (/^(running|connected|active|healthy|ready|succeeded|serving|true)$/.test(text)) return "ok";
  if (/(failed|unreachable|disconnected|unhealthy|timed out|error|blocked)/.test(text)) return "bad";
  if (/(pending|starting|degraded|draining|cordoned|stopping|waiting)/.test(text)) return "warn";
  return "";
}
function badge(value) { return h("span", { class: tone(value) }, label(value) || "unknown"); }
function ago(value) {
  if (!value) return "";
  const seconds = Math.round((Date.now() - new Date(value).getTime()) / 1000);
  const future = seconds < 0, s = Math.abs(seconds);
  const text = s < 60 ? s + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
  return future ? "in " + text : text + " ago";
}
function bytes(value) {
  let n = Number(value || 0), units = ["B", "KiB", "MiB", "GiB", "TiB"], i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + units[i];
}
function cpu(value) { return (Number(value || 0) / 1000).toFixed(2) + " cpu"; }
function table(columns, rows, onclick) {
  if (!rows.length) return h("p", { class: "muted" }, "Nothing here yet.");
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, columns.map(([title]) => h("th", {}, title)))),
    h("tbody", {}, rows.map(row => h("tr", onclick ? { class: "click", onclick: () => onclick(row) } : {},
      columns.map(([, render, cls]) => h("td", cls ? { class: cls } : {}, render(row))))))));
}
function card(key, value) { return h("div", { class: "card" }, h("div", { class: "k" }, key), h("div", { class: "v" }, value)); }

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({ error: response.statusText }));
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}
async function post(path, body) {
  return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}
function showError(error) { document.getElementById("errors").textContent = error ? String(error.message || error) : ""; }

async function refresh() {
  try {
    const snapshot = await api("/api/snapshot");
    state.snapshot = snapshot;
    showError(snapshot.errors && snapshot.errors.length ? snapshot.errors.join("\n") : "");
    document.getElementById("meta").textContent = `${snapshot.target || "context"} via ${snapshot.transport} · ${new Date(snapshot.refreshedAt).toLocaleTimeString()}`;
    if (state.app) await loadApp(state.app, true);
    if (state.tab === "Jobs") await loadJobs(true);
    render();
  } catch (error) { showError(error); }
}

async function loadApp(name, quiet) {
  try { state.appData = await api("/api/apps/" + encodeURIComponent(name)); state.app = name; }
  catch (error) { showError(error); }
  if (!quiet) render();
}
async function loadJobs(quiet) {
  try { state.jobs = await api("/api/jobs"); } catch (error) { state.jobs = state.jobs || { jobs: [] }; showError(error); }
  if (!quiet) render();
}

let logTimer = null;
function openLog(source) {
  clearTimeout(logTimer);
  state.log = { source, lines: [], cursor: "", exited: false, follow: true };
  pollLog();
  render();
}
function closeLog() { clearTimeout(logTimer); state.log = null; render(); }
async function pollLog() {
  const log = state.log;
  if (!log) return;
  const params = new URLSearchParams({ app: log.source.app, cursor: log.cursor });
  if (log.source.job) { params.set("job", log.source.job); params.set("run", log.source.run); }
  else { params.set("service", log.source.service); params.set("replica", log.source.replica); }
  try {
    const batch = await api("/api/logs?" + params);
    if (state.log !== log) return;
    if (batch.cursorReset) log.lines.push({ stream: "orch", text: "— log rotated or reset —" });
    log.lines.push(...batch.lines);
    if (log.lines.length > 5000) log.lines.splice(0, log.lines.length - 5000);
    log.cursor = batch.nextCursor || log.cursor;
    log.exited = batch.exited;
    log.error = "";
  } catch (error) { log.error = error.message; }
  renderLog();
  if (state.log === log && !log.exited) logTimer = setTimeout(pollLog, 1500);
}
function logPanel() {
  if (!state.log) return null;
  const s = state.log.source;
  const title = s.job ? `${s.app} / ${s.job} run ${s.run}` : `${s.app} / ${s.service} #${s.replica}`;
  return h("section", { id: "log" },
    h("div", { class: "row" }, h("h2", {}, "Logs: " + title), h("button", { class: "act", onclick: closeLog }, "Close"), h("span", { id: "logstate", class: "muted" })),
    h("pre", { id: "logbody", onscroll: e => { const p = e.target; state.log.follow = p.scrollTop + p.clientHeight >= p.scrollHeight - 4; } }));
}
function renderLog() {
  const pre = document.getElementById("logbody");
  if (!pre || !state.log) return;
  const log = state.log;
  pre.replaceChildren(...log.lines.map(line => h("span", { class: line.stream === "stderr" ? "stderr" : "" }, line.text.endsWith("\n") ? line.text : line.text + "\n")));
  if (log.follow) pre.scrollTop = pre.scrollHeight;
  document.getElementById("logstate").textContent = log.error ? "error: " + log.error : log.exited ? "exited" : "following";
}

function overview(s) {
  const c = s.cluster || {};
  const nodes = s.nodes || [], apps = s.applications || [], runtimes = (s.runtimes && s.runtimes.runtimes) || [];
  return [
    h("div", { class: "cards" },
      card("Cluster", c.name || "—"), card("Endpoint", c.endpoint || "—"), card("Generation", c.generation || "0"),
      card("Nodes", `${nodes.filter(n => label(n.connectionStatus) === "connected").length}/${nodes.length} connected`),
      card("Applications", `${apps.filter(a => label(a.executionStatus) === "running").length}/${apps.length} running`),
      card("Runtimes", runtimes.length), card("Workload CIDR", c.workloadCidr || "—")),
    h("h2", {}, "Applications"), appsTable(apps),
    h("h2", {}, "Nodes"), nodesTable(nodes),
    h("h2", {}, "Recent events"), eventsTable(((s.events && s.events.events) || []).slice(-15).reverse()),
  ];
}
function appsTable(apps) {
  return table([
    ["Name", a => a.name], ["Status", a => badge(a.executionStatus)], ["Generation", a => `${a.activeGeneration}/${a.generation}`],
    ["Revision", a => (a.revisionId || "").slice(0, 12)], ["Updated", a => ago(a.updatedAt)], ["Message", a => a.executionMessage || a.executionReason, "wrap"],
  ], apps, a => { state.tab = "Applications"; location.hash = "Applications"; loadApp(a.name); });
}
function nodesTable(nodes, actions) {
  const columns = [
    ["Name", n => n.name], ["Connection", n => badge(n.connectionStatus)], ["Lifecycle", n => badge(n.lifecycle)],
    ["Ingress", n => n.ingress ? "yes" : "no"], ["Address", n => n.advertiseAddress],
    ["CPU", n => `${cpu(n.assignedCpuMillis)} / ${cpu(n.allocatableCpuMillis)}`],
    ["Memory", n => `${bytes(n.assignedMemoryBytes)} / ${bytes(n.allocatableMemoryBytes)}`],
    ["Labels", n => Object.entries(n.labels || {}).map(([k, v]) => `${k}=${v}`).join(", "), "wrap"],
    ["Seen", n => ago(n.lastSeenAt)],
  ];
  if (actions) {
    columns.push(["Platform", n => `${n.operatingSystem}/${n.architecture} ${n.runtimeVersion}`]);
    columns.push(["Cert", n => h("span", { class: tone(n.certificateState === "valid" ? "healthy" : n.certificateState) }, n.certificateState || "")]);
    columns.push(["Actions", nodeActions]);
  }
  return table(columns, nodes);
}
function nodeActions(n) {
  const life = label(n.lifecycle), buttons = [];
  const act = (action, text, prompt) => h("button", { class: "act", onclick: async () => {
    if (!confirm(`${prompt} on ${n.name}?`)) return;
    try { await post("/api/nodes/" + encodeURIComponent(n.name), { action }); await refresh(); } catch (error) { showError(error); }
  } }, text);
  if (life === "active") buttons.push(act("cordon", "Cordon", "Cordon and stop new placements"));
  if (life === "cordoned") buttons.push(act("uncordon", "Uncordon", "Allow placements again"));
  if (life === "active" || life === "cordoned") buttons.push(act("drain", "Drain", "Begin draining workloads"));
  buttons.push(n.ingress ? act("ingress-off", "Disable ingress", "Disable ingress") : act("ingress-on", "Enable ingress", "Enable ingress"));
  return h("span", {}, buttons);
}

function applications(s) {
  const apps = s.applications || [];
  const out = [appsTable(apps)];
  if (state.app && state.appData) out.push(appDetail(state.appData));
  return out;
}
function appDetail(data) {
  const a = data.application || {}, deployments = (data.deployments && data.deployments.deployments) || [];
  const allocations = a.allocations || [];
  return h("section", {},
    h("h2", {}, `Application ${a.name}`),
    h("div", { class: "cards" }, card("Status", badge(a.executionStatus)), card("Generation", `${a.activeGeneration} active / ${a.generation} desired`),
      card("Revision", (a.revisionId || "").slice(0, 12)), card("Updated", ago(a.updatedAt))),
    a.executionMessage ? h("p", { class: "muted" }, a.executionMessage) : null,
    h("h2", {}, "Replicas"),
    table([
      ["Service", r => r.service], ["#", r => r.replica], ["Phase", r => badge(r.phase)], ["Health", r => badge(r.healthStatus)],
      ["Node", r => r.nodeName], ["Address", r => r.address], ["Restarts", r => r.restartCount], ["Message", r => r.message || r.reason, "wrap"],
      ["", r => h("a", { onclick: () => openLog({ app: a.name, service: r.service, replica: r.replica }) }, "logs")],
    ], allocations),
    h("h2", {}, "Routes"),
    table([
      ["Domain", r => (r.https ? "https://" : "http://") + r.domain], ["Service", r => r.service], ["State", r => badge(r.state)],
      ["Certificate", r => r.certificateState], ["Upstreams", r => r.upstreamCount], ["Node", r => r.nodeName], ["Message", r => r.message, "wrap"],
    ], a.routes || []),
    (a.tcpRoutes || []).length ? [h("h2", {}, "TCP routes"), table([
      ["Port", r => `${r.publicPort} → ${r.targetPort}`], ["Service", r => r.service], ["State", r => badge(r.state)], ["Upstreams", r => r.upstreamCount], ["Node", r => r.nodeName],
    ], a.tcpRoutes)] : null,
    (a.cronJobs || []).length ? [h("h2", {}, "Cron jobs"), table([
      ["Job", j => j.job], ["Last", j => badge(j.lastState)], ["Next run", j => ago(j.nextRunAt)],
      ["", j => j.lastRunId ? h("a", { onclick: () => openLog({ app: a.name, job: j.job, run: j.lastRunId }) }, "last run logs") : ""],
    ], a.cronJobs)] : null,
    h("h2", {}, "Deployments"),
    table([
      ["Gen", d => d.generation], ["Revision", d => (d.revisionId || "").slice(0, 12)], ["Outcome", d => badge(d.outcome)],
      ["Status", d => badge(d.executionStatus)], ["Created", d => ago(d.createdAt)], ["", d => d.active ? "active" : d.current ? "current" : ""],
      ["Images", d => (d.images || []).map(i => i.image || i.requestedImage || "").filter(Boolean).join(", "), "wrap"],
      ["", d => d.current ? "" : h("button", { class: "act", onclick: async () => {
        if (!confirm(`Restore generation ${d.generation} of ${a.name} as a new deployment? Data and secret values are not restored.`)) return;
        try { await post(`/api/apps/${encodeURIComponent(a.name)}/rollback`, { revisionId: d.revisionId, expectedGeneration: String(a.generation) }); await loadApp(a.name); }
        catch (error) { showError(error); }
      } }, "Roll back")],
    ], deployments),
    h("details", {}, h("summary", { class: "muted" }, "Manifest"), h("pre", {}, prettyJSON(a.canonicalManifestJson))),
  );
}
function prettyJSON(text) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text || ""; } }

function runtimes(s) {
  const r = s.runtimes || {}, list = r.runtimes || [];
  return [
    r.truncated ? h("p", { class: "warn" }, "Runtime list truncated.") : null,
    table([
      ["Application", x => x.application], ["Resource", x => x.resource], ["Kind", x => label(x.kind)],
      ["Replica / run", x => label(x.kind) === "cron run" ? x.runId : x.replica], ["Node", x => x.nodeName],
      ["State", x => badge(label(x.kind) === "cron run" ? x.jobRunState : x.allocationPhase)], ["Health", x => badge(x.healthStatus)],
      ["Restarts", x => x.restartCount], ["CPU", x => cpu(x.cpuMillis)], ["Memory", x => bytes(x.memoryBytes)],
      ["Started", x => ago(x.startedAt)], ["Message", x => x.message || x.reason, "wrap"],
    ], list, x => openLog(label(x.kind) === "cron run" ? { app: x.application, job: x.resource, run: x.runId } : { app: x.application, service: x.resource, replica: x.replica })),
  ];
}
function jobs() {
  if (!state.jobs) { loadJobs(); return h("p", { class: "muted" }, "Loading jobs…"); }
  return table([
    ["ID", j => j.id], ["Application", j => j.application], ["Service", j => j.service], ["Kind", j => j.kind],
    ["State", j => badge(j.status && j.status.state)], ["Exit", j => j.status && j.status.hasExitCode ? j.status.exitCode : ""],
    ["Scheduled", j => ago(j.status && j.status.scheduledAt)],
  ], state.jobs.jobs || []);
}
function eventsTable(events) {
  return table([["#", e => e.sequence], ["Kind", e => e.kind], ["When", e => ago(e.createdAt)], ["Payload", e => e.payloadJson, "wrap"]], events);
}
function events(s) {
  const query = state.eventFilter.toLowerCase();
  const list = ((s.events && s.events.events) || []).filter(e => !query || (e.kind + e.payloadJson).toLowerCase().includes(query)).reverse();
  return [h("div", { class: "row" }, h("input", { placeholder: "Filter events", value: state.eventFilter, oninput: e => { state.eventFilter = e.target.value; render(); } })), eventsTable(list)];
}

function render() {
  document.getElementById("tabs").replaceChildren(...tabs.map(tab => h("button", { class: tab === state.tab ? "active" : "", onclick: () => {
    state.tab = tab; location.hash = tab; if (tab === "Jobs") state.jobs = null; render();
  } }, tab)));
  const view = document.getElementById("view");
  const focused = view.contains(document.activeElement) ? document.activeElement : null;
  const s = state.snapshot;
  if (!s) { view.replaceChildren(h("p", { class: "muted" }, "Loading…")); return; }
  const content = { Overview: overview, Applications: applications, Runtimes: runtimes, Nodes: st => nodesTable(st.nodes || [], true), Jobs: jobs, Events: events }[state.tab] || overview;
  const scroll = document.getElementById("logbody");
  const logScroll = scroll ? scroll.scrollTop : 0;
  view.replaceChildren(...[content(s)].flat(), logPanel() || "");
  renderLog();
  const pre = document.getElementById("logbody");
  if (pre && state.log && !state.log.follow) pre.scrollTop = logScroll;
  if (focused && focused.tagName === "INPUT") { const input = view.querySelector("input"); if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } }
}

window.addEventListener("hashchange", () => { const tab = location.hash.slice(1); if (tabs.includes(tab) && tab !== state.tab) { state.tab = tab; render(); } });
render();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
