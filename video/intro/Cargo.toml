[package]
name = "orch-intro"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
# `--features metal` renders on the GPU with Skia on macOS and adds the `preview` window.
fframes_skia_renderer = { version = "=1.3.0", features = ["metal"], optional = true }
fframes_native_player = { version = "=1.3.0", default-features = false, features = ["metal", "audio"], optional = true }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.0", features = ["h264", "libav-agree-gpl"] }

[features]
metal = ["dep:fframes_skia_renderer", "dep:fframes_native_player"]

[lib]
name = "orch_intro"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "orch-intro"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
