schema = "v1alpha1"
name = "notes"

[services.database]
image = "docker.io/library/postgres:17-alpine"
replicas = 1

[services.database.resources]
cpu = "500m"
memory = "1Gi"

[services.database.env]
POSTGRES_DB = "notes"
POSTGRES_USER = "notes"

[services.database.secret_env]
POSTGRES_PASSWORD = "database-password"

[[services.database.mounts]]
source = "database"
target = "/var/lib/postgresql/data"

[volumes.database]
driver = "local"
