schema = "v1alpha1"
name = "runtime-demo"

[services.worker]
image = "docker.io/library/busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0"
command = ["/bin/sh"]
args = ["-c", "echo \"$MESSAGE\"; echo diagnostic >&2; echo started >> /data/starts; trap 'exit 0' TERM INT; while sleep 30; do echo tick; done"]
replicas = 1
restart = "always"

[services.worker.resources]
cpu = "100m"
memory = "64Mi"

[services.worker.env]
MESSAGE = "hello from orch"

[[services.worker.mounts]]
source = "data"
target = "/data"

[volumes.data]
driver = "local"
